rules:
  dependabot-cooldown:
    config:
      days: 1
  unpinned-uses:
    config:
      policies:
        # Official GitHub actions and CodeQL use major tags for compatible security updates.
        "actions/*": ref-pin
        "github/codeql-action/*": ref-pin
        # Maintainer-owned release action follows its compatible major ref.
        "bcomnes/go-bump": ref-pin
        # Require immutable references for all other third-party actions.
        "*": hash-pin
